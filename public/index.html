<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f1c">
    <title>Bolinhas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f1c;
            --ink: #eef0ff;
            --muted: #8c91b6;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --line: rgba(255, 255, 255, 0.14);
            --focus: #9aa7ff;
            --warn: #ffb9a8;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
            font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #canvas { position: fixed; inset: 0; display: block; touch-action: none; }

        /* Topo */
        .top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
            display: flex; justify-content: space-between; align-items: center;
            padding: calc(16px + env(safe-area-inset-top)) 20px 0;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
        .chips { display: flex; align-items: center; gap: 8px; }
        .chip-wrap { position: relative; pointer-events: auto; }
        .chip .bolt { width: 13px; height: 13px; color: #ffd27c; }
        .chip.fast .bolt { color: #ff9b6b; }
        .chip {
            display: flex; align-items: center; gap: 8px; cursor: pointer; font: inherit;
            padding: 7px 10px 7px 12px; border-radius: 999px; font-size: 13px; color: var(--muted);
            background: var(--glass); border: 1px solid var(--line);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            font-variant-numeric: tabular-nums; transition: background 0.15s;
        }
        .chip:hover { background: var(--glass-hover); }
        .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .chip b { color: var(--ink); font-weight: 800; }
        .chip svg { width: 14px; height: 14px; flex: none; transition: transform 0.15s; }
        .chip[aria-expanded="true"] svg { transform: rotate(180deg); }
        .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #7cf0ff, #c58bff); }
        .chip.heavy .chip-dot { background: #ffb347; }

        /* Menu de quantidade */
        .menu {
            position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
            width: min(260px, calc(100vw - 32px)); padding: 6px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 2px;
            background: rgba(22, 25, 45, 0.92); border: 1px solid var(--line);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .opt {
            display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
            padding: 10px 12px; border: 0; border-radius: 14px; background: transparent; color: var(--ink);
            font: inherit; font-size: 14px; text-align: left; cursor: pointer;
        }
        .opt:hover { background: rgba(255, 255, 255, 0.1); }
        .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
        .opt[aria-checked="true"] { background: rgba(154, 167, 255, 0.16); }
        .opt .label { display: flex; align-items: baseline; gap: 8px; }
        .opt small { color: var(--muted); font-size: 12px; }
        .opt .tick { width: 16px; height: 16px; flex: none; opacity: 0; }
        .opt[aria-checked="true"] .tick { opacity: 1; }
        .custom-form { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
        .custom-form input {
            flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; font: inherit; font-size: 14px;
            color: var(--ink); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); outline: 0;
        }
        .custom-form input:focus { border-color: rgba(154, 167, 255, 0.8); }
        .custom-form .apply {
            flex: none; padding: 0 14px; border: 0; border-radius: 12px; cursor: pointer;
            font: inherit; font-size: 14px; font-weight: 800; color: #0d0f1c; background: var(--ink);
        }
        .custom-form .apply:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .custom-warn { flex-basis: 100%; margin: 2px 2px 0; font-size: 12px; line-height: 1.35; color: var(--warn); }
        .custom-warn.lvl2 { color: #ff9b6b; font-weight: 800; }
        .custom-warn.lvl3 {
            color: #ffb4b4; font-weight: 800; padding: 8px 10px; border-radius: 10px;
            background: rgba(255, 60, 60, 0.16); border: 1px solid rgba(255, 90, 90, 0.7);
        }
        .custom-form .apply.danger { background: #ff5c5c; color: #fff; }
        .chip.extreme .chip-dot { background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }

        /* Barra de baixo */
        .dock-wrap {
            position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
            bottom: calc(18px + env(safe-area-inset-bottom));
            width: min(660px, calc(100% - 24px));
        }
        .dock {
            display: flex; align-items: flex-end; gap: 6px; padding: 8px; border-radius: 28px;
            background: var(--glass); border: 1px solid var(--line);
            backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .dock:focus-within {
            border-color: rgba(154, 167, 255, 0.7);
            box-shadow: 0 0 0 4px rgba(154, 167, 255, 0.15), 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .icon-btn {
            flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
            border: 0; border-radius: 50%; cursor: pointer; color: var(--ink);
            background: rgba(255, 255, 255, 0.09); transition: background 0.15s;
        }
        .icon-btn:hover { background: var(--glass-hover); }
        .icon-btn:focus-visible, .photo-pill button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .icon-btn svg { width: 22px; height: 22px; }
        #img-upload { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        #txt {
            flex: 1; min-width: 0; max-height: 96px; resize: none; border: 0; outline: 0; background: transparent;
            color: var(--ink); font: inherit; font-size: 17px; line-height: 1.35; padding: 11px 8px;
        }
        #txt::placeholder { color: var(--muted); }

        .photo-pill {
            flex: none; display: flex; align-items: center; gap: 8px; height: 44px; max-width: 190px;
            padding: 0 6px 0 4px; border-radius: 22px; background: rgba(255, 255, 255, 0.09);
        }
        .photo-pill canvas { width: 36px; height: 36px; border-radius: 50%; flex: none; }
        .photo-pill span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .photo-pill button {
            flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
            border: 0; border-radius: 50%; cursor: pointer; color: var(--ink); background: rgba(255, 255, 255, 0.12);
        }
        .photo-pill button:hover { background: var(--glass-hover); }
        .photo-pill button svg { width: 14px; height: 14px; }

        .meta {
            display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px 0;
            font-size: 13px; color: var(--muted);
        }
        #status-hint.warn { color: var(--warn); }
        #counter { font-variant-numeric: tabular-nums; flex: none; }


        .dist-toggle {
            display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px;
            border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
            color: var(--muted); background: var(--glass); font: inherit; font-size: 12px;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        .dist-toggle .switch { width: 28px; height: 16px; padding: 2px; border-radius: 99px; background: #55596d; transition: background .18s; }
        .dist-toggle .switch::after { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: white; transition: transform .18s; }
        .dist-toggle[aria-pressed="true"] { color: var(--ink); }
        .dist-toggle[aria-pressed="true"] .switch { background: #398c68; }
        .dist-toggle[aria-pressed="true"] .switch::after { transform: translateX(12px); }
        .dist-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        @media (max-width: 480px) { .dist-toggle { font-size: 0; gap: 5px; } .dist-toggle .switch { flex:none; } }

        .worker-panel {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: calc(112px + env(safe-area-inset-bottom)); z-index: 4;
            width: min(660px, calc(100% - 24px)); padding: 10px 14px;
            border: 1px solid var(--line); border-radius: 16px;
            background: rgba(22, 25, 45, 0.72); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); color: var(--muted);
            font-size: 12px; display: flex; flex-wrap: wrap; gap: 7px 14px;
            pointer-events: none;
        }
        .worker-panel[hidden] { display: none !important; }
        .worker-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .worker-device { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 17px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; vertical-align: middle; color: #c5caff; }
        .worker-dot { width: 7px; height: 7px; border-radius: 50%; background: #777b91; }
        .worker-item.busy .worker-dot { background: #65e6a3; box-shadow: 0 0 8px rgba(101,230,163,.65); }
        .worker-item.offline .worker-dot { background: #ff7777; }
        @media (max-width: 480px) {
            .worker-panel { bottom: calc(108px + env(safe-area-inset-bottom)); font-size: 11px; }
        }

        /* Arrastar arquivo */
        .drop {
            position: fixed; inset: 14px; z-index: 20; display: none; align-items: center; justify-content: center;
            border: 2px dashed rgba(255, 255, 255, 0.45); border-radius: 32px;
            background: rgba(13, 15, 28, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            font-size: 28px; font-weight: 800; letter-spacing: -0.01em; pointer-events: none;
        }
        body.dragging .drop { display: flex; }

        @media (max-width: 480px) {
            .photo-pill span { display: none; }
            .top { padding-left: 16px; padding-right: 16px; }
            .brand span { display: none; }
            .speed-label { display: none; }
            .chips { gap: 6px; }
            .chip { font-size: 12px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="worker-panel" id="worker-panel" aria-live="polite" hidden></div>

<header class="top">
    <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <circle cx="8" cy="17" r="6" fill="#7cf0ff"/>
            <circle cx="18" cy="9" r="5" fill="#c58bff"/>
            <circle cx="19" cy="20" r="3.4" fill="#ffd27c"/>
        </svg>
        <span>bolinhas</span>
    </div>
    <div class="chips">
        <button type="button" class="dist-toggle" id="dist-toggle" aria-pressed="true" title="Ativar ou desativar workers remotos">Distribuído <span class="switch" aria-hidden="true"></span></button>
    <div class="chip-wrap" id="speed-wrap">
        <button type="button" class="chip" id="speed-chip" aria-haspopup="true" aria-expanded="false" aria-controls="speed-menu"
                title="Velocidade das bolinhas. Clique pra mudar.">
            <svg class="bolt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l9-12h-6.5z"/></svg>
            <b class="speed-label">Velocidade</b>
            <span id="speed-val">1×</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div class="menu" id="speed-menu" hidden>
            <button type="button" class="opt" role="menuitemradio" aria-checked="true" data-speed="1">
                <span class="label">Padrão <small>(1×)</small></span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-speed="10">
                <span class="label">10×</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-speed="20">
                <span class="label">20×</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-speed="50">
                <span class="label">50×</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-speed="100">
                <span class="label">100×</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" id="speed-opt-custom" role="menuitemradio" aria-checked="false">
                <span class="label">Personalizado <small id="speed-custom-value"></small></span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <form class="custom-form" id="speed-form" hidden>
                <input id="speed-input" type="text" inputmode="decimal" autocomplete="off" placeholder="Quantas vezes? (0,1 a 100)" aria-label="Velocidade personalizada">
                <button type="submit" class="apply">Aplicar</button>
                <p class="custom-warn" id="speed-warn" role="alert" hidden></p>
            </form>
        </div>
    </div>
    <div class="chip-wrap" id="chip-wrap">
        <button type="button" class="chip" id="chip" aria-haspopup="true" aria-expanded="false" aria-controls="menu"
                title="Quantidade de bolinhas. Clique pra mudar.">
            <span class="chip-dot"></span>
            <b id="chip-mode">Auto</b>
            <span><span id="chip-count">0</span> <span id="chip-unit">bolinhas</span></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div class="menu" id="menu" hidden>
            <button type="button" class="opt" role="menuitemradio" aria-checked="true" data-count="auto">
                <span class="label">Auto <small>escolhe sozinho</small></span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-count="1000">
                <span class="label">1.000 bolinhas</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-count="2000">
                <span class="label">2.000 bolinhas</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-count="5000">
                <span class="label">5.000 bolinhas</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" role="menuitemradio" aria-checked="false" data-count="10000">
                <span class="label">10.000 bolinhas</span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <button type="button" class="opt" id="opt-custom" role="menuitemradio" aria-checked="false">
                <span class="label">Personalizado <small id="custom-value"></small></span>
                <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </button>
            <form class="custom-form" id="custom-form" hidden>
                <input id="custom-input" type="text" inputmode="numeric" autocomplete="off" placeholder="Quantas bolinhas?" aria-label="Quantidade personalizada de bolinhas">
                <button type="submit" class="apply">Aplicar</button>
                <p class="custom-warn" id="custom-warn" role="alert" hidden></p>
            </form>
        </div>
    </div>
    </div>
</header>

<main class="dock-wrap">
    <div class="dock">
        <button type="button" class="icon-btn" id="upload-btn" aria-label="Carregar foto" title="Carregar foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>
            </svg>
        </button>
        <input type="file" id="img-upload" accept="image/*" tabindex="-1">

        <textarea id="txt" rows="1" maxlength="250" placeholder="Escreve algo pra virar bolinhas" aria-label="Texto das bolinhas"></textarea>

        <div class="photo-pill" id="photo-pill" hidden>
            <canvas id="thumb" width="72" height="72"></canvas>
            <span id="photo-name"></span>
            <button type="button" id="clear-btn" aria-label="Remover foto" title="Remover foto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
    </div>
    <div class="meta">
        <span id="status-hint" role="status">Escreve algo ou solta uma foto</span>
        <span id="counter">0/250</span>
    </div>
</main>

<div class="drop" id="drop">Solta a foto aqui</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const inputTxt = document.getElementById("txt");
const statusHint = document.getElementById("status-hint");
const counterEl = document.getElementById("counter");
const chipCount = document.getElementById("chip-count");
const fileInput = document.getElementById("img-upload");
const photoPill = document.getElementById("photo-pill");
const photoName = document.getElementById("photo-name");
const thumb = document.getElementById("thumb");

const TWO_PI = Math.PI * 2;
const TRAIL = "rgba(13, 15, 28, 0.4)";
const FONT = '"Bricolage Grotesque", system-ui, sans-serif';
const nf = new Intl.NumberFormat("pt-BR");
const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.3 : 1;

// ---------- MODO AUTOMÁTICO ----------
// A quantidade de bolinhas ativas é decidida sozinha:
//  1) pelo conteúdo: quantos pontos o texto/foto realmente tem
//  2) por um teto que se ajusta à velocidade do aparelho (começa alto e desce se travar)
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700 ||
                 window.matchMedia("(pointer: coarse)").matches;
const MAX_POOL = isMobile ? 16000 : 40000;   // total de bolinhas que existem
const MIN_COUNT = 1500;                      // nunca usa menos que isso
const MIN_CAP = 5000;                        // menor teto que o ajuste de desempenho aceita
let perfCap = Math.round(MAX_POOL * 0.75);   // teto atual
let capLimit = MAX_POOL;                     // teto máximo aprendido (desce se o aparelho sofrer)
let activeCount = 0;                         // quantas bolinhas estão em uso agora

let manualCount = null;   // null = modo automático; número = quantidade escolhida no menu
let particles = [];
let isIdle = true;
let currentImg = null;
let cachedPoints = null;
let idleRotation = 0;
let pulseOffset = 0;
let lastFill = null;

let tempMessage = null;
let tempDetail = "";
let tempTimer = null;

const offCanvas = document.createElement("canvas");
const offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

// anel de bolinhas coloridas (parado, sem conteúdo)
const RING = Array.from({ length: 72 }, (_, k) => `hsla(${Math.round((k / 72) * 360)}, 85%, 68%, 0.6)`);

// ---------- FORMAS ----------
// Cada forma tem um ou mais traços fechados (contorno, olhos...). Cada traço vira uma tabela
// de pontos espaçados igualmente, e recebe uma fatia das bolinhas proporcional ao seu tamanho.
// Formas com yUp: true são desenhadas com o y pra cima (como no papel) e viradas na hora.
const DEG = Math.PI / 180;

// pontos de um arco de elipse; ângulos em graus (y pra cima) e n passos
function arc(cx, cy, rx, ry, a0, a1, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
        const a = (a0 + ((a1 - a0) * i) / n) * DEG;
        out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return out;
}
const ellipsePart = (cx, cy, rx, ry) => ({ t1: TWO_PI, f: t => [cx + rx * Math.cos(t), cy + ry * Math.sin(t)] });
// diferença entre dois ângulos em radianos, de -π a π
const angDist = (a, b) => ((a - b + 3 * Math.PI) % TWO_PI) - Math.PI;

// corta os cantos de um polígono (Chaikin): pontas ficam arredondadas e as curvas suaves
function chaikin(pts, iters, closed) {
    let p = pts;
    for (let it = 0; it < iters; it++) {
        const n = p.length, q = [];
        const last = closed ? n : n - 1;
        if (!closed) q.push(p[0]);
        for (let i = 0; i < last; i++) {
            const a = p[i], b = p[(i + 1) % n];
            q.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]]);
            q.push([0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
        }
        if (!closed) q.push(p[n - 1]);
        p = q;
    }
    return p;
}

const TABLE_N = 4096;
const TRACE_MIN = 0.35;   // traço pequeno (olho, nariz) conta pelo menos isso, pra aparecer

// polígono -> linha suave (cantos cortados). Traço aberto vai e volta, pra virar um laço.
function polyLine(part) {
    const closed = part.closed !== false;
    const iters = part.smooth !== undefined ? part.smooth : 3;
    const p = chaikin(part.poly, iters, closed);
    if (closed) return p.concat([p[0]]);
    return p.concat(p.slice(1, -1).reverse(), [p[0]]);
}

// tabela de pontos espaçados por igual ao longo de uma linha (lista de [x, y])
function resampleLine(line) {
    const n = line.length;
    const cum = new Float64Array(n);
    for (let i = 1; i < n; i++) {
        cum[i] = cum[i - 1] + Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]);
    }
    const total = cum[n - 1];
    const table = new Float32Array(TABLE_N * 2);
    let j = 0;
    for (let k = 0; k < TABLE_N; k++) {
        const target = (total * k) / TABLE_N;
        while (j < n - 2 && cum[j + 1] < target) j++;
        const seg = cum[j + 1] - cum[j] || 1;
        const u = Math.min(1, Math.max(0, (target - cum[j]) / seg));
        table[2 * k] = line[j][0] + (line[j + 1][0] - line[j][0]) * u;
        table[2 * k + 1] = line[j][1] + (line[j + 1][1] - line[j][1]) * u;
    }
    return { table, len: total };
}

function buildShape(shape) {
    const M = 12000;
    const parts = shape.parts || [{ f: shape.f, t1: shape.t1 }];
    const lines = parts.map(part => {
        const pts = part.poly ? polyLine(part) : Array.from({ length: M + 1 }, (_, i) => part.f((part.t1 * i) / M));
        return shape.yUp ? pts.map(p => [p[0], -p[1]]) : pts;
    });

    // centraliza e encaixa a forma inteira numa caixa de -1 a 1
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    lines.forEach(l => l.forEach(p => {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1];
        if (p[1] > maxY) maxY = p[1];
    }));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const s = Math.max(maxX - minX, maxY - minY) / 2;

    shape.subs = lines.map(l => resampleLine(l.map(p => [(p[0] - cx) / s, (p[1] - cy) / s])));
    shape.len = Math.max(...shape.subs.map(t => t.len));   // traço mais longo (iguala a velocidade entre formas)

    // fatia das bolinhas de cada traço, proporcional ao comprimento
    const w = shape.subs.map(t => Math.max(t.len, TRACE_MIN));
    const sum = w.reduce((x, y) => x + y, 0);
    shape.share = [0];
    w.forEach(x => shape.share.push(shape.share[shape.share.length - 1] + x / sum));
    shape.share[shape.share.length - 1] = 1;
    return shape;
}

const SHAPE_EVERY = 9000;   // troca de forma a cada 9 s
let shapeIdx = 0, curShape = SHAPES[0], nextShapeAt = 0, shapeSpeed = 1;
// velocidade (menu): multiplicador de 0,1× a 100×; 1× é o jeito de sempre
let speedMul = 1, easeIdle = 1 / 11, easeText = 1 / 16, easeLeave = 1 / 7;
let shapeX = 0, shapeY = 0;

    const finger = window.matchMedia("(pointer: coarse)").matches;
    return n.charAt(0).toUpperCase() + n.slice(1) + ": toca pra trocar, " + (finger ? "passa o dedo" : "passa o mouse") + " pra pintar";
}

function setShape(i) {
    shapeIdx = i;
    curShape = SHAPES[i];
    nextShapeAt = performance.now() + SHAPE_EVERY;
    // formas de traço longo giravam mais rápido que o círculo: iguala a velocidade na tela
    shapeSpeed = Math.min(1.6, Math.max(0.05, TWO_PI / SHAPES[i].len));
    if (isIdle && !statusHint.classList.contains("warn")) setStatus(idleStatus());
}

function pickShape() {
    let i;
    do { i = Math.floor(Math.random() * SHAPES.length); } while (i === shapeIdx && SHAPES.length > 1);
    return i;
}

// ponto de um traço na posição u (0 a 1), em shapeX/shapeY
function shapeAt(table, u) {
    const f = u * TABLE_N, i0 = Math.floor(f), t = f - i0;
    const a = (i0 % TABLE_N) * 2, b = ((i0 + 1) % TABLE_N) * 2;
    shapeX = table[a] + (table[b] - table[a]) * t;
    shapeY = table[a + 1] + (table[b + 1] - table[a + 1]) * t;
}

// pincel de cores (passar o mouse/dedo) e explosões dos easter eggs
const PAINT = Array.from({ length: 48 }, (_, k) => `hsl(${Math.round(k * 7.5)}, 90%, 62%)`);
let brushOn = false, brushX = 0, brushY = 0, brushR2 = 0;
let fuse = null;                       // contagem regressiva ativa: { kind, secs, key, at, total, fired, lastSec }
let blast = null;                      // explosão em andamento
let blastDrag = 0.96, blastGravity = 0;

class Particle {
    constructor(i) {
        this.i = i;
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.destX = this.x;
        this.destY = this.y;
        this.r = 1.2;
        this.color = RING[0];
        this.jx = Math.random() * 2 - 1;           // espalha as bolinhas numa faixa em volta do traço
        this.jy = Math.random() * 2 - 1;
        this.ringSize = 1.3 + Math.random() * 1.7; // tamanho da bolinha na forma
        // posição fixa dessa bolinha no desenho (0 a 1). A sequência da razão áurea espalha qualquer
        // grupo das primeiras N bolinhas por igual: mudar a quantidade só liga/desliga bolinhas,
        // ninguém troca de lugar (antes, cada ajuste do modo Auto fazia o texto todo escorregar).
        this.k = (0.5 + i * 0.6180339887498949) % 1;
        this.paint = null;                         // cor do pincel (some quando o desenho muda)
        this.free = false;                         // true enquanto voa numa explosão
        this.vx = 0;
        this.vy = 0;
    }

    update() {
        if (isIdle) {
            const frac = this.i / activeCount;
            const subs = curShape.subs, share = curShape.share;
            let k = 0;
            while (k < subs.length - 1 && frac >= share[k + 1]) k++;
            // cada bolinha anda só dentro do seu traço (contorno, olho...)
            const lf = (frac - share[k]) / (share[k + 1] - share[k]);
            let u = lf + idleRotation;
            u -= Math.floor(u);
            shapeAt(subs[k].table, u);
            this.destX = ringCx + shapeX * shapeR + this.jx * ringThick;
            this.destY = ringCy + shapeY * shapeR + this.jy * ringThick;

            let diff = Math.abs(u - pulseU);
            if (diff > 0.5) diff = 1 - diff;

            const boost = sizeBoost();
            if (diff < 0.04) { this.color = "white"; this.r = (this.ringSize + 0.9) * boost; }
            else { this.color = RING[(frac * 72) | 0]; this.r = this.ringSize * boost; }
        }

        if (this.free) {
            // explosão: voa solto, com atrito (e gravidade nas maiores)
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= blastDrag;
            this.vy = this.vy * blastDrag + blastGravity;
        } else {
            const f = isIdle ? easeIdle : easeText;   // fração do caminho por quadro (velocidade do menu)
            this.x += (this.destX - this.x) * f;
            this.y += (this.destY - this.y) * f;
        }

        if (brushOn) {
            const dx = this.x - brushX, dy = this.y - brushY;
            if (dx * dx + dy * dy < brushR2) this.paint = PAINT[(Math.random() * PAINT.length) | 0];
        }

        const col = this.paint || this.color;
        if (col !== lastFill) { ctx.fillStyle = col; lastFill = col; }
        if (this.r > 4.5) {
            // bolinha grande (poucas bolinhas): círculo de verdade. As pequenas continuam quadradinhos, que são bem mais baratos.
            ctx.beginPath();
            ctx.arc(this.x + this.r / 2, this.y + this.r / 2, this.r / 2, 0, TWO_PI);
            ctx.fill();
        } else {
            ctx.fillRect(this.x, this.y, this.r, this.r);
        }
    }
}

// Área livre pro desenho: fora o topo (logo) e a barra de baixo
const UI_TOP = 64, UI_BOTTOM = 124;
function stage() {
    const h = Math.max(canvas.height * 0.4, canvas.height - UI_TOP - UI_BOTTOM);
    return { w: canvas.width, h, cy: UI_TOP + h / 2 };
}

let ringCx = 0, ringCy = 0, ringR = 0, ringThick = 0, shapeR = 0, pulseU = 0;
function updateRingGeometry() {
    const st = stage();
    ringCx = canvas.width / 2;
    ringCy = st.cy;
    ringR = Math.min(st.w, st.h) * 0.4;
    shapeR = ringR * 0.95;
    ringThick = Math.max(6, ringR * 0.045);
}

// animação ao trocar a quantidade: as que sobram voltam pro chip, as novas saem dele
let leaveFrom = 0, leaveTo = 0, leaveUntil = 0, leaveX = 0, leaveY = 0;

function idleCount() {
    updateRingGeometry();
    if (manualCount !== null) return manualCount;
    return Math.max(MIN_COUNT, Math.min(perfCap, Math.round(ringR * 100)));
}

const chipUnit = document.getElementById("chip-unit");
function updateChip() {
    chipCount.textContent = nf.format(activeCount);
    chipUnit.textContent = activeCount === 1 ? "bolinha" : "bolinhas";
}

// poucas bolinhas ficam maiores, senão 1 bolinha de 2 pixels some na tela
function sizeBoost() { return activeCount < 1000 ? Math.min(4, Math.sqrt(1000 / Math.max(1, activeCount))) : 1; }

function setStatus(text, warn) {
    statusHint.textContent = text;
    statusHint.classList.toggle("warn", !!warn);
}

// Easter eggs escritos no texto (a tag não aparece no desenho):
//   [rainbow]palavra          a palavra seguinte fica em arco-íris
//   [boom x] [kaboom x] [bomb x]   explode depois de x segundos
const FUSE_RE_G = /\[\s*(boom|kaboom|bomb)(?:\s+(\d+(?:[.,]\d+)?))?\s*\]/gi;
const RAINBOW = "[rainbow]";

function parseSpecial(raw) {
    let fuse = null;
    const plain = raw.replace(FUSE_RE_G, (m, kind, num) => {
        if (!fuse) fuse = { kind: kind.toLowerCase(), secs: num ? Math.min(3600, parseFloat(num.replace(",", "."))) : 3 };
        return "";
    });
    const paras = plain.split("\n").map(par => {
        const toks = [];
        let rbNext = false;
        par.split(/\s+/).forEach(w => {
            let rb = rbNext;
            rbNext = false;
            while (w.toLowerCase().startsWith(RAINBOW)) { w = w.slice(RAINBOW.length); rb = true; }
            if (!w) { if (rb) rbNext = true; return; }   // "[rainbow]" sozinho vale pra próxima palavra
            toks.push({ t: w, rb, w: 0 });
        });
        return toks;
    });
    return { paras, fuse, key: plain.trim(), empty: !paras.some(p => p.length) };
}

// quebra as palavras em linhas que cabem na largura
function layoutTokens(paras, maxW, spaceW) {
    const lines = [];
    paras.forEach(par => {
        let cur = [], width = 0;
        par.forEach(tok => {
            if (cur.length && width + spaceW + tok.w > maxW) {
                lines.push({ toks: cur, width });
                cur = [tok];
                width = tok.w;
            } else {
                width += (cur.length ? spaceW : 0) + tok.w;
                cur.push(tok);
            }
        });
        lines.push({ toks: cur, width });
    });
    return lines;
}

function rainbowFill(x, w) {
    const g = offCtx.createLinearGradient(x, 0, x + Math.max(w, 1), 0);
    for (let k = 0; k <= 6; k++) g.addColorStop(k / 6, `hsl(${k * 50}, 100%, 60%)`);
    return g;
}

function drawTextToOffscreen(paras) {
    const st = stage();
    const maxW = canvas.width * 0.9;
    const maxH = st.h * 0.85;
    let fontSize = Math.min(150, st.h / 4.5);
    let lines, spaceW;

    for (;;) {
        offCtx.font = `800 ${fontSize}px ${FONT}`;
        spaceW = offCtx.measureText(" ").width;
        paras.forEach(par => par.forEach(tok => { tok.w = offCtx.measureText(tok.t).width; }));
        lines = layoutTokens(paras, maxW, spaceW);
        const widest = Math.max(...lines.map(l => l.width));
        const totalH = lines.length * fontSize * 1.2;
        if ((widest <= maxW && totalH <= maxH) || fontSize <= 12) break;
        fontSize -= 4;
    }

    offCtx.textAlign = "left";
    offCtx.textBaseline = "middle";
    const lineH = fontSize * 1.2;
    const startY = st.cy - (lines.length * lineH) / 2 + lineH / 2;
    lines.forEach((line, i) => {
        let x = (canvas.width - line.width) / 2;
        const y = startY + i * lineH;
        line.toks.forEach(tok => {
            offCtx.fillStyle = tok.rb ? rainbowFill(x, tok.w) : "white";
            offCtx.fillText(tok.t, x, y);
            x += tok.w + spaceW;
        });
    });
}

function imgSize(img) {
    return {
        w: img.naturalWidth || img.width || 512,
        h: img.naturalHeight || img.height || 512
    };
}

function drawImageToOffscreen() {
    const { w, h } = imgSize(currentImg);
    const st = stage();
    const availW = canvas.width * 0.95, availH = st.h * 0.95;
    const k = Math.min(availW / w, availH / h);
    const drawW = w * k, drawH = h * k;
    offCtx.drawImage(currentImg, (canvas.width - drawW) / 2, st.cy - drawH / 2, drawW, drawH);
}

// ---------- SINCRONIZAÇÃO ----------
let syncRevision = 0;

async function handleSync() {
    const thisSync = ++syncRevision;
    clearPaint();   // o desenho mudou: a tinta do pincel sai
    const parsed = parseSpecial(tempMessage || inputTxt.value);
    const hasText = !parsed.empty;
    const showImg = currentImg && !tempMessage;
    // com foto na tela os easter eggs não valem (o texto nem aparece): sem contagem nem explosão
    if (!tempMessage) updateFuse(showImg ? { fuse: null, key: "" } : parsed);

    if (!hasText && !showImg) {
        if (!isIdle) setShape(pickShape());
        isIdle = true;
        cachedPoints = null;
        activeCount = idleCount();
        updateChip();
        setStatus(idleStatus());
        return;
    }

    isIdle = false;
    if (tempMessage) setStatus(tempDetail, true);
    else setStatus(showImg ? "Formando a imagem" : "Formando o texto");

    offCanvas.width = canvas.width;
    offCanvas.height = canvas.height;
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);

    if (showImg) drawImageToOffscreen();
    else drawTextToOffscreen(parsed.paras);

    const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
    const step = 2;
    let points;
    try {
        const bytes = new Uint8Array(imgData.buffer, imgData.byteOffset, imgData.byteLength);
        const response = await fetch("/api/points?width=" + canvas.width + "&height=" + canvas.height +
            "&step=" + step + "&distributed=" + (distributedEnabled ? "1" : "0"), {
            method: "POST",
            headers: { "Content-Type": "application/octet-stream" },
            body: bytes
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        points = (await response.json()).points;
        if (!Array.isArray(points)) throw new Error("Resposta inválida");
    } catch (error) {
        if (thisSync !== syncRevision) return;
        setStatus("Servidor indisponível, processando neste aparelho");
        points = [];
        for (let y = 0; y < canvas.height; y += step) {
            for (let x = 0; x < canvas.width; x += step) {
                const i = (y * canvas.width + x) * 4;
                if (imgData[i + 3] > 120) {
                    points.push({ x, y, r: imgData[i], g: imgData[i + 1], b: imgData[i + 2] });
                }
            }
        }
    }
    if (thisSync !== syncRevision) return;

    if (points.length === 0) {
        if (!isIdle) setShape(pickShape());
        isIdle = true;
        cachedPoints = null;
        activeCount = idleCount();
        updateChip();
        setStatus("Não achei nada pra desenhar nessa imagem", true);
        return;
    }

    cachedPoints = points;
    assign(points);
}

// Decide quantas bolinhas usar e distribui todas por TODOS os pontos de forma uniforme
function assign(points) {
    const n = points.length;
    // ~2 bolinhas por ponto amostrado deixa a forma cheia; o teto de desempenho limita
    activeCount = manualCount !== null
        ? manualCount
        : Math.max(MIN_COUNT, Math.min(perfCap, Math.round(n * 2.2)));
    // se faltam bolinhas pra cobrir a área, elas crescem um pouco pra não ficar esburacado
    const areaPerDot = (n * 4) / activeCount;
    const maxR = activeCount < 1000 ? 3.2 * sizeBoost() : 3.2;
    const baseR = Math.max(0.9, Math.min(maxR, Math.sqrt(areaPerDot) * 0.95));
    for (let i = 0; i < activeCount; i++) {
        const p = particles[i];
        const pt = points[(p.k * n) | 0];
        p.destX = pt.x + (Math.random() - 0.5) * 2;
        p.destY = pt.y + (Math.random() - 0.5) * 2;
        p.color = `rgb(${pt.r}, ${pt.g}, ${pt.b})`;
        p.r = baseR * (0.75 + Math.random() * 0.5);
    }
    updateChip();
}

function applyCap() {
    if (isIdle) { activeCount = idleCount(); updateChip(); }
    else if (cachedPoints) assign(cachedPoints);
}

let syncQueued = false;
function queueSync() {
    if (syncQueued) return;
    syncQueued = true;
    requestAnimationFrame(() => { syncQueued = false; handleSync(); });
}

// Ajuste de desempenho: mede o tempo dos quadros e sobe/desce o teto
let warmFrames = 0, sumDt = 0, countDt = 0, lockUntil = 0;
function adapt(dt, now) {
    if (manualCount !== null) return;   // quantidade escolhida na mão: não mexe
    if (dt > 100) return;               // aba ficou em segundo plano
    if (++warmFrames < 60) return;      // ignora o aquecimento
    sumDt += dt; countDt++;
    if (countDt < 90) return;
    const avg = sumDt / countDt;
    sumDt = 0; countDt = 0;

    if (avg > 22 && perfCap > MIN_CAP) {
        perfCap = Math.max(MIN_CAP, Math.round(perfCap * 0.8));
        capLimit = perfCap;             // esse aparelho não aguenta mais que isso
        applyCap();
    } else if (avg < 18 && perfCap < capLimit && now > lockUntil) {
        perfCap = Math.min(capLimit, Math.round(perfCap * 1.15));
        applyCap();
    }
}

// ---------- ARQUIVOS ----------
function showTempMessage(msg, ms) {
    tempMessage = msg;
    clearTimeout(tempTimer);
    tempTimer = setTimeout(() => { tempMessage = null; handleSync(); }, ms);

}

function loadViaImageElement(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
        img.src = url;
    });
}

// Não confia no tipo informado pelo navegador (às vezes vem vazio ou diferente):
// tenta abrir o arquivo de verdade.
async function decodeImage(file) {
    try { return await loadViaImageElement(file); }
    catch (e) {
        if (window.createImageBitmap) return await createImageBitmap(file);
        throw e;
    }
}

function unsupported(file) {
    const ext = file.name && file.name.includes(".") ? "." + file.name.split(".").pop().toLowerCase() : "";
    const kind = file.type || ext || "tipo desconhecido";
    tempDetail = `Não consegui abrir ${file.name || "o arquivo"} (${kind}). Use PNG, JPG, GIF, WebP, SVG ou ICO.`;
    showTempMessage("Arquivo não suportado 💀", 15000);
}

function showPhotoPill(img, name) {
    const s = thumb.width, tctx = thumb.getContext("2d");
    const { w, h } = imgSize(img);
    const k = Math.max(s / w, s / h);
    tctx.clearRect(0, 0, s, s);
    tctx.drawImage(img, (s - w * k) / 2, (s - h * k) / 2, w * k, h * k);
    photoName.textContent = name || "foto";
    photoPill.hidden = false;
}

async function handleFile(file) {
    if (!file) return;    const type = file.type || "";
    if (type.startsWith("video/") || type.startsWith("audio/")) { unsupported(file); return; }
    try {
        const img = await decodeImage(file);
        clearTimeout(tempTimer);
        tempMessage = null;
        currentImg = img;
        showPhotoPill(img, file.name);
        handleSync();
    } catch (e) {
        unsupported(file);
    }
}

// ---------- EXPLOSÕES ([boom x], [kaboom x], [bomb x]) ----------
const FUSE_ICON = { boom: "💥", kaboom: "☄️", bomb: "💣" };
const BLASTS = {
    boom:   { v0: 5, v1: 20, drag: 0.955, g: 0,    ms: 1700, flash: 0,   shake: 0,  shakeMs: 0 },
    kaboom: { v0: 8, v1: 44, drag: 0.972, g: 0.12, ms: 3000, flash: 0.7, shake: 22, shakeMs: 800 },
    bomb:   { v0: 6, v1: 30, drag: 0.965, g: 0.22, ms: 2300, flash: 0.45, shake: 12, shakeMs: 450 }
};

// só reinicia a contagem quando o texto ou a tag mudam (redimensionar a janela não reinicia)
function updateFuse(parsed) {
    const f = parsed.fuse;
    if (!f) {
        fuse = null;
        cancelBlast();
        return;
    }
    const key = f.kind + "|" + f.secs + "|" + parsed.key;
    if (fuse && fuse.key === key) return;
    cancelBlast();
    fuse = { kind: f.kind, secs: f.secs, key, at: performance.now() + f.secs * 1000, total: Math.max(1, f.secs * 1000), fired: false };
}

function restoreStatus() {
    if (statusHint.classList.contains("warn")) return;
    setStatus(isIdle ? idleStatus() : (currentImg && !tempMessage ? "Formando a imagem" : "Formando o texto"));
}

function cancelBlast() {
    if (!blast) return;
    for (let i = 0; i < particles.length; i++) particles[i].free = false;
    blast = null;
    canvas.style.transform = "";
}

function endBlast() {
    cancelBlast();
    restoreStatus();   // as bolinhas voltam a formar o desenho
}

function explode(now) {
    fuse.fired = true;
    const cfg = BLASTS[fuse.kind];
    const cx = canvas.width / 2, cy = stage().cy;
    blastDrag = cfg.drag;
    blastGravity = cfg.g;
    for (let i = 0; i < activeCount; i++) {
        const p = particles[i];
        // cada bolinha sai pra longe do centro, com um pouco de desvio
        const ang = Math.atan2(p.y - cy, p.x - cx) + (Math.random() - 0.5) * 0.7;
        const sp = cfg.v0 + Math.random() * (cfg.v1 - cfg.v0);
        p.vx = Math.cos(ang) * sp;
        p.vy = Math.sin(ang) * sp - (cfg.g ? Math.random() * 3 : 0);
        p.free = true;
    }
    blast = { flash: cfg.flash, shake: cfg.shake, shakeMs: cfg.shakeMs, start: now, until: now + cfg.ms };
    if (!statusHint.classList.contains("warn")) setStatus(`${FUSE_ICON[fuse.kind]} ${fuse.kind.toUpperCase()}!`);
}

function fuseTick(now) {
    if (!fuse || fuse.fired) return;
    const left = fuse.at - now;
    if (left <= 0) { explode(now); return; }
    // contagem regressiva no status (se outra coisa trocar o texto do status, volta no quadro seguinte)
    if (!statusHint.classList.contains("warn")) {
        const label = `${FUSE_ICON[fuse.kind]} ${fuse.kind} em ${Math.ceil(left / 1000)}s`;
        if (statusHint.textContent !== label) statusHint.textContent = label;
    }
}

// tremor da tela e clarão (desligados se o sistema pede menos movimento)
let shaking = false;
function effects(now) {
    let amp = 0;
    if (slow === 1) {
        if (fuse && !fuse.fired && fuse.kind === "bomb") {
            const t = 1 - Math.max(0, fuse.at - now) / fuse.total;   // a bomba vai tremendo mais até estourar
            amp = 0.4 + 3.5 * t * t;
        }
        if (blast && blast.shake) {
            const t = (now - blast.start) / blast.shakeMs;
            if (t < 1) amp = Math.max(amp, blast.shake * (1 - t));
        }
        if (blast && blast.flash) {
            const t = (now - blast.start) / 350;
            if (t < 1) {
                ctx.fillStyle = `rgba(255, 255, 255, ${(blast.flash * (1 - t)).toFixed(3)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                lastFill = null;
            }
        }
    }
    if (amp > 0) {
        canvas.style.transform = `translate(${((Math.random() - 0.5) * 2 * amp).toFixed(1)}px, ${((Math.random() - 0.5) * 2 * amp).toFixed(1)}px)`;
        shaking = true;
    } else if (shaking) {
        canvas.style.transform = "";
        shaking = false;
    }
}

// ---------- LOOP ----------
let lastT = performance.now();
// Trava de segurança: no modo manual pesado, se vários quadros seguidos levarem mais de 1,5 s,
// a página está praticamente congelada. Volta pro Auto sozinha.
let slowFrames = 0;
function rescue() {
    slowFrames = 0;
    setCount(null);
    setStatus("Estava pesado demais, voltei pro Auto", true);
    setTimeout(() => {
        if (statusHint.classList.contains("warn") && !tempMessage) {
            setStatus(isIdle ? idleStatus() : (currentImg ? "Formando a imagem" : "Formando o texto"));
        }
    }, 8000);
}

function loop(now) {
    const dt = now - lastT;
    lastT = now;
    adapt(dt, now);

    if (manualCount !== null && manualCount > WARN_ABOVE && dt > 1500 && dt < 15000) {
        if (++slowFrames >= 3) rescue();
    } else if (dt < 1000) {
        slowFrames = 0;
    }

    ctx.fillStyle = TRAIL;
    lastFill = TRAIL;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (isIdle) {
        updateRingGeometry();
        const k = Math.min(dt, 50) / 16.667;
        idleRotation += (0.015 / TWO_PI) * k * slow * shapeSpeed * speedMul;   // em voltas (0 a 1) na curva
        pulseOffset += (0.045 / TWO_PI) * k * slow * speedMul;
        pulseU = pulseOffset - Math.floor(pulseOffset);
        if (now > nextShapeAt) setShape(pickShape());
    }

    fuseTick(now);
    if (blast && now >= blast.until) endBlast();
    effects(now);

    for (let i = 0; i < activeCount; i++) particles[i].update();

    if (now < leaveUntil) {
        for (let i = leaveFrom; i < leaveTo; i++) {
            const p = particles[i];
            p.x += (leaveX - p.x) * easeLeave;
            p.y += (leaveY - p.y) * easeLeave;
            if (p.color !== lastFill) { ctx.fillStyle = p.color; lastFill = p.color; }
            ctx.fillRect(p.x, p.y, p.r, p.r);
        }
    }
    requestAnimationFrame(loop);
}

// ---------- MENU DE QUANTIDADE ----------
const PRESETS = [1000, 2000, 5000, 10000];
const WARN_ABOVE = 10000, DANGER_ABOVE = 200000, CUSTOM_MIN = 1, CUSTOM_MAX = 500000;
let armed = false;   // acima de DANGER_ABOVE o primeiro "Aplicar" só pede confirmação
const chipEl = document.getElementById("chip");
const chipWrap = document.getElementById("chip-wrap");
const chipMode = document.getElementById("chip-mode");
const menu = document.getElementById("menu");
const optCustom = document.getElementById("opt-custom");
const customValue = document.getElementById("custom-value");
const customForm = document.getElementById("custom-form");
const customInput = document.getElementById("custom-input");

function ensurePool(n) {
    while (particles.length < n) particles.push(new Particle(particles.length));
}

function chipCenter() {
    const r = chipEl.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

// value: null = automático
function setCount(value) {
    const prev = activeCount;
    const wasHeavy = manualCount !== null && manualCount > WARN_ABOVE;
    leaveUntil = 0;
    manualCount = value;
    const heavy = manualCount !== null && manualCount > WARN_ABOVE;
    if (value !== null) ensurePool(value);
    warmFrames = 0; sumDt = 0; countDt = 0;
    if (isIdle) activeCount = idleCount();
    else if (cachedPoints) assign(cachedPoints);
    updateChip();
    updateMenuState();

    // animação: bolinhas novas saem do chip; as que sobram voltam pra ele.
    // Acima de 10.000 (entrando ou saindo) fica desligada: já é pesado o bastante.
    if (slow === 1 && !heavy && !wasHeavy && activeCount !== prev) {
        const c = chipCenter();
        if (activeCount > prev) {
            for (let i = prev; i < activeCount; i++) {
                particles[i].x = c.x + (Math.random() - 0.5) * 16;
                particles[i].y = c.y + (Math.random() - 0.5) * 16;
            }
        } else {
            leaveFrom = activeCount;
            leaveTo = prev;
            leaveX = c.x;
            leaveY = c.y;
            leaveUntil = performance.now() + 900;
        }
    }
}

function updateMenuState() {
    const isCustom = manualCount !== null && !PRESETS.includes(manualCount);
    menu.querySelectorAll("[data-count]").forEach(btn => {
        const v = btn.dataset.count;
        const on = v === "auto" ? manualCount === null : Number(v) === manualCount;
        btn.setAttribute("aria-checked", String(on));
    });
    optCustom.setAttribute("aria-checked", String(isCustom));
    customValue.textContent = isCustom ? nf.format(manualCount) : "";
    chipMode.textContent = manualCount === null ? "Auto" : "Manual";
    chipEl.classList.toggle("heavy", manualCount !== null && manualCount > WARN_ABOVE);
    chipEl.classList.toggle("extreme", manualCount !== null && manualCount > 100000);
}

function parseCustom() {
    const digits = customInput.value.replace(/\D/g, "");   // aceita "15000" e "15.000"
    return digits ? parseInt(digits, 10) : NaN;
}

const applyBtn = customForm.querySelector(".apply");

function showWarn(msg, level) {
    customWarn.textContent = msg;
    customWarn.hidden = !msg;
    customWarn.className = "custom-warn" + (level > 1 ? " lvl" + level : "");
}

function checkCustom() {
    armed = false;
    applyBtn.textContent = "Aplicar";
    applyBtn.classList.remove("danger");
    const n = parseCustom();
    if (n > CUSTOM_MAX) return showWarn(`O máximo é ${nf.format(CUSTOM_MAX)} bolinhas.`, 1);
    if (n > DANGER_ABOVE) {
        return showWarn(`🚨 PERIGO: ${nf.format(n)} bolinhas pode congelar esta aba por vários segundos e travar o seu aparelho. ` +
            `Salve o que estiver aberto em outras abas antes. Se a página congelar, ela volta pro Auto sozinha.`, 3);
    }
    if (n > 50000) {
        return showWarn(`⚠️ Cuidado: ${nf.format(n)} bolinhas é MUITO. Em PC fraco vai virar um slideshow e o ventilador vai gritar.`, 2);
    }
    if (n > WARN_ABOVE) {
        return showWarn(`Acima de ${nf.format(WARN_ABOVE)} bolinhas o seu aparelho pode não aguentar e a página pode travar.`, 1);
    }
    showWarn("", 1);
}

function showCustomForm(show) {
    customForm.hidden = !show;
    optCustom.hidden = show;
    customWarn.hidden = true;
    if (show) {
        customInput.value = manualCount !== null && !PRESETS.includes(manualCount) ? String(manualCount) : "";
        customInput.focus();
        customInput.select();   // o que for digitado substitui o valor anterior
        checkCustom();
    }
}

function openMenu() {
    menu.hidden = false;
    chipEl.setAttribute("aria-expanded", "true");
}

function closeMenu(refocus) {
    menu.hidden = true;
    chipEl.setAttribute("aria-expanded", "false");
    showCustomForm(false);
    if (refocus) chipEl.focus();
}

chipEl.addEventListener("click", () => (menu.hidden ? openMenu() : closeMenu()));
menu.querySelectorAll("[data-count]").forEach(btn => btn.addEventListener("click", () => {
    setCount(btn.dataset.count === "auto" ? null : Number(btn.dataset.count));
    closeMenu(true);
}));
optCustom.addEventListener("click", () => showCustomForm(true));
customInput.addEventListener("input", checkCustom);
customForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const n = parseCustom();
    if (!(n >= CUSTOM_MIN)) {
        showWarn(`Digite um número de ${CUSTOM_MIN} a ${nf.format(CUSTOM_MAX)}.`, 1);
        customInput.focus();
        return;
    }
    // acima de 200 mil: o primeiro clique só arma o botão, o segundo aplica
    if (Math.min(n, CUSTOM_MAX) > DANGER_ABOVE && !armed) {
        armed = true;
        applyBtn.textContent = "Aplicar mesmo assim";
        applyBtn.classList.add("danger");
        return;
    }
    setCount(Math.min(n, CUSTOM_MAX));
    closeMenu(true);
});
document.addEventListener("pointerdown", (e) => {
    if (!menu.hidden && !chipWrap.contains(e.target)) closeMenu();
    if (!speedMenu.hidden && !speedWrap.contains(e.target)) closeSpeedMenu();
});
document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!menu.hidden) closeMenu(true);
    if (!speedMenu.hidden) closeSpeedMenu(true);
});

// ---------- MENU DE VELOCIDADE ----------
const SPEED_PRESETS = [1, 10, 20, 50, 100];
const SPEED_MIN = 0.1, SPEED_MAX = 100;
const speedWrap = document.getElementById("speed-wrap");
const speedChip = document.getElementById("speed-chip");
const speedMenu = document.getElementById("speed-menu");
const speedVal = document.getElementById("speed-val");
const speedOptCustom = document.getElementById("speed-opt-custom");
const speedCustomValue = document.getElementById("speed-custom-value");
const speedForm = document.getElementById("speed-form");
const speedInput = document.getElementById("speed-input");
const speedWarn = document.getElementById("speed-warn");

const fmtSpeed = (v) => String(+v.toFixed(2)).replace(".", ",") + "×";

function setSpeed(v) {
    speedMul = Math.min(SPEED_MAX, Math.max(SPEED_MIN, v));
    // fração do caminho por quadro; passa de 1 só estouraria o destino, então trava em 1
    easeIdle = Math.min(1, speedMul / 11);
    easeText = Math.min(1, speedMul / 16);
    easeLeave = Math.min(1, speedMul / 7);
    const isCustom = !SPEED_PRESETS.includes(speedMul);
    speedMenu.querySelectorAll("[data-speed]").forEach(b => b.setAttribute("aria-checked", String(Number(b.dataset.speed) === speedMul)));
    speedOptCustom.setAttribute("aria-checked", String(isCustom));
    speedCustomValue.textContent = isCustom ? fmtSpeed(speedMul) : "";
    speedVal.textContent = fmtSpeed(speedMul);
    speedChip.classList.toggle("fast", speedMul >= 50);
}

function parseSpeed() {
    const t = speedInput.value.trim().replace(",", ".").replace(/[x×]$/i, "");
    return /^\d*\.?\d+$/.test(t) ? parseFloat(t) : NaN;
}

function showSpeedForm(show) {
    speedForm.hidden = !show;
    speedOptCustom.hidden = show;
    speedWarn.hidden = true;
    if (show) {
        speedInput.value = SPEED_PRESETS.includes(speedMul) ? "" : String(speedMul).replace(".", ",");
        speedInput.focus();
        speedInput.select();
    }
}

// o menu tem a largura do outro; se não couber do lado do botão, desliza pra dentro da tela
function fitMenu(m) {
    m.style.transform = "";
    const r = m.getBoundingClientRect();
    let dx = 0;
    if (r.left < 8) dx = 8 - r.left;
    else if (r.right > window.innerWidth - 8) dx = window.innerWidth - 8 - r.right;
    if (dx) m.style.transform = `translateX(${Math.round(dx)}px)`;
}

function openSpeedMenu() {
    if (!menu.hidden) closeMenu();
    speedMenu.hidden = false;
    speedChip.setAttribute("aria-expanded", "true");
    fitMenu(speedMenu);
}

function closeSpeedMenu(refocus) {
    speedMenu.hidden = true;
    speedChip.setAttribute("aria-expanded", "false");
    showSpeedForm(false);
    if (refocus) speedChip.focus();
}

speedChip.addEventListener("click", () => (speedMenu.hidden ? openSpeedMenu() : closeSpeedMenu()));
speedMenu.querySelectorAll("[data-speed]").forEach(btn => btn.addEventListener("click", () => {
    setSpeed(Number(btn.dataset.speed));
    closeSpeedMenu(true);
}));
speedOptCustom.addEventListener("click", () => showSpeedForm(true));
speedInput.addEventListener("input", () => { speedWarn.hidden = true; });
speedForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const n = parseSpeed();
    if (!(n >= SPEED_MIN && n <= SPEED_MAX)) {
        speedWarn.textContent = `Digite um número de ${String(SPEED_MIN).replace(".", ",")} a ${SPEED_MAX} (pode ter vírgula, tipo 0,5).`;
        speedWarn.hidden = false;
        speedInput.focus();
        return;
    }
    setSpeed(n);
    closeSpeedMenu(true);
});
// abrir o menu de bolinhas fecha o de velocidade (o clique já passa pelo pointerdown acima)

// tocar na tela (fora da interface) troca a forma do modo parado
let ignoreTap = false, downX = 0, downY = 0;
canvas.addEventListener("pointerdown", (e) => {
    ignoreTap = !menu.hidden || !speedMenu.hidden;   // clique que só fecha o menu não conta
    downX = e.clientX;
    downY = e.clientY;
});
canvas.addEventListener("pointerup", (e) => {
    if (ignoreTap) { ignoreTap = false; return; }
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 12) return;   // arrastou pra pintar: não é toque
    if (isIdle && !tempMessage) {
        clearPaint();
        setShape(pickShape());
    }
});

// ---------- INÍCIO ----------
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
for (let i = 0; i < MAX_POOL; i++) particles.push(new Particle(i));
setShape(Math.floor(Math.random() * SHAPES.length));
handleSync();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueSync);
</script>
